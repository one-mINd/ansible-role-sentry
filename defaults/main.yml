---
# defaults file for sentry_selfhosted

sentry_docker_compose_project_folder: /opt/docker/sentry
sentry_version: 26.8.0
sentry_bind: 9000

sentry_env: {}
sentry_mail: {}
sentry_config: {}
sentry_config_py: {}

sentry_url: "https://url.com"
sentry_superusers: []

# Controls whether install.sh automatically modifies sentry.conf.py during upgrades.
# When Sentry introduces new infrastructure (e.g. migrating nodestore from Postgres to SeaweedFS),
# the install script may need to patch the config. 
#
# "1" - apply changes automatically (recommended for fresh installs and upgrades)
# "0" - skip automatic changes, you will need to update sentry.conf.py manually
#
# See: https://develop.sentry.dev/self-hosted/
sentry_apply_automatic_config_updates: "0"

sentry_clickhouse_max_memory_usage_ratio: 0.3

sentry_limits:
  smtp:
    cpu: 0.05
    ram: 100M
  memcached:
    cpu: 0.10
    ram: 200M
  redis:
    cpu: 0.30
    ram: 500M
  postgres:
    cpu: 1.00
    ram: 2000M
  pgbouncer:
    cpu: 0.10
    ram: 200M
  kafka:
    cpu: 1.00
    ram: 2000M
  clickhouse:
    cpu: 2.00
    ram: 4000M
  seaweedfs:
    cpu: 0.20
    ram: 500M
  snuba-api:
    cpu: 0.50
    ram: 1000M
  snuba-errors-consumer:
    cpu: 0.20
    ram: 500M
  snuba-outcomes-consumer:
    cpu: 0.20
    ram: 500M
  snuba-outcomes-billing-consumer:
    cpu: 0.20
    ram: 500M
  snuba-group-attributes-consumer:
    cpu: 0.20
    ram: 500M
  snuba-replacer:
    cpu: 0.20
    ram: 500M
  snuba-subscription-consumer-events:
    cpu: 0.20
    ram: 500M
  snuba-subscription-consumer-eap-items:
    cpu: 0.20
    ram: 500M
  symbolicator:
    cpu: 0.50
    ram: 1000M
  symbolicator-cleanup:
    cpu: 0.10
    ram: 200M
  web:
    cpu: 1.50
    ram: 3000M
  events-consumer:
    cpu: 0.30
    ram: 400M
  attachments-consumer:
    cpu: 0.30
    ram: 400M
  post-process-forwarder-errors:
    cpu: 0.20
    ram: 300M
  sentry-cleanup:
    cpu: 0.10
    ram: 200M
  nginx:
    cpu: 0.10
    ram: 200M
  relay:
    cpu: 0.30
    ram: 500M
  taskbroker:
    cpu: 0.10
    ram: 200M
  taskscheduler:
    cpu: 0.10
    ram: 200M
  taskworker:
    cpu: 0.50
    ram: 1000M
